<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 선체: 위쪽이 뱃머리 (접안중 - 초록) -->
  <polygon points="32,3 50,20 50,54 14,54 14,20" fill="#22c55e" stroke="#ffffff" stroke-width="2.5"/>
  <!-- 뱃머리 강조 -->
  <polygon points="32,3 42,18 22,18" fill="#bbf7d0" opacity="0.7"/>
  <!-- 선교(브릿지) -->
  <rect x="22" y="28" width="20" height="13" rx="2" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="1.5"/>
  <!-- 굴뚝 -->
  <rect x="28" y="19" width="8" height="11" rx="1.5" fill="#374151" stroke="#9ca3af" stroke-width="1"/>
  <!-- 갑판 라인들 -->
  <line x1="18" y1="43" x2="46" y2="43" stroke="#bbf7d0" stroke-width="1" opacity="0.6"/>
  <line x1="18" y1="48" x2="46" y2="48" stroke="#bbf7d0" stroke-width="1" opacity="0.6"/>
</svg>
